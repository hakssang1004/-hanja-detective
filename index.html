<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>漢字語 탐정단 — 격자 속 한국의 한자어 찾기</title>
<meta name="description" content="한문 수업 활동 · 분야별 한자어 찾기 미션 10 — 격자 속 한국의 한자어를 찾는 인터랙티브 웹 게임">
<style>
:root{
  --cream:#FFF9F2; --cream2:#FFF3E6;
  --ink:#4B4358; --ink-soft:#7A7189;
  --pink:#FFD6E4; --pink-d:#F49CBB;
  --mint:#CBF3E2; --mint-d:#6FD0AC;
  --lav:#E1DAFF; --lav-d:#A28BEA;
  --sky:#D6ECFF; --sky-d:#6BB3E8;
  --peach:#FFE2CC; --peach-d:#F6A870;
  --yellow:#FFEFC2; --yellow-d:#E7B93F;
  --card:#FFFFFF; --line:#F0E7DE;
  --shadow:0 10px 26px rgba(120,100,140,.10), 0 2px 6px rgba(120,100,140,.06);
  --shadow-sm:0 4px 12px rgba(120,100,140,.10);
  --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic","Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",system-ui,-apple-system,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 12% 8%, #FFEAF3 0%, transparent 42%),
    radial-gradient(circle at 88% 4%, #E7F7FF 0%, transparent 40%),
    radial-gradient(circle at 82% 92%, #EFE9FF 0%, transparent 44%),
    radial-gradient(circle at 10% 88%, #E9FBF3 0%, transparent 40%),
    var(--cream);
  min-height:100vh;
  word-break:keep-all;
  overflow-wrap:anywhere;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(#E9DDD0 1px, transparent 1px);
  background-size:22px 22px;opacity:.35;
}
#app{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:18px 18px 60px}
.hidden{display:none !important}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:14px;padding:6px 4px 18px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .mark{
  width:52px;height:52px;border-radius:18px;flex:0 0 auto;
  background:linear-gradient(145deg,#FFF0F6,#E7E0FF);
  display:grid;place-items:center;font-size:26px;
  box-shadow:var(--shadow-sm);border:2px solid #fff;
}
.brand h1{margin:0;font-size:22px;letter-spacing:-.4px;line-height:1.15}
.brand h1 .han{font-weight:800}
.brand p{margin:3px 0 0;font-size:12.5px;color:var(--ink-soft)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.stat-pill{
  display:flex;align-items:center;gap:6px;background:#fff;border:2px solid #fff;
  border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;
  box-shadow:var(--shadow-sm);white-space:nowrap
}
.stat-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--mint-d)}

/* ---------- buttons ---------- */
.btn{
  font:inherit;font-size:13.5px;font-weight:700;color:var(--ink);
  background:#fff;border:2px solid #fff;border-radius:999px;
  padding:9px 16px;cursor:pointer;box-shadow:var(--shadow-sm);
  display:inline-flex;align-items:center;gap:6px;transition:transform .12s ease, box-shadow .12s ease;
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.primary{background:linear-gradient(135deg,#EC7FA6,#A472E0);color:#fff}
.btn.mint{background:linear-gradient(135deg,#45BE9C,#43A6D6);color:#fff}
.btn.ghost{background:rgba(255,255,255,.7)}
.btn.small{padding:7px 12px;font-size:12.5px}
.btn.icon{width:40px;height:40px;padding:0;justify-content:center;font-size:17px}

/* ---------- map ---------- */
.map-hero{
  background:linear-gradient(150deg,#FFF6FA,#F2EEFF 55%,#EAF8FF);
  border:2px solid #fff;border-radius:28px;padding:20px 22px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px;
}
.map-hero h2{margin:0;font-size:19px}
.map-hero p{margin:4px 0 0;font-size:13px;color:var(--ink-soft)}
.map-hero .grow{flex:1 1 240px}
.mini-progress{height:10px;border-radius:999px;background:#fff;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.06);margin-top:10px;max-width:320px}
.mini-progress span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--pink-d),var(--lav-d));transition:width .4s ease}

.cases{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.case{
  position:relative;background:var(--card);border:2px solid #fff;border-radius:var(--r);
  padding:16px 15px 15px;cursor:pointer;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:8px;overflow:hidden;
  transition:transform .16s ease, box-shadow .16s ease;
}
.case:hover{transform:translateY(-4px);box-shadow:0 16px 32px rgba(120,100,140,.16)}
.case::after{
  content:"";position:absolute;inset:auto -30% -55% -30%;height:70%;border-radius:50%;
  background:var(--tint);opacity:.55;pointer-events:none;
}
.case-top{display:flex;align-items:center;gap:8px;position:relative;z-index:1}
.case-num{
  width:38px;height:38px;border-radius:13px;display:grid;place-items:center;flex:0 0 auto;
  font-weight:800;font-size:15px;color:#fff;background:var(--accent);
  box-shadow:0 4px 10px color-mix(in srgb, var(--accent) 40%, transparent);
}
.case-emoji{font-size:22px;margin-left:auto}
.case h3{margin:2px 0 0;font-size:15.5px;line-height:1.3;position:relative;z-index:1}
.case .sub{font-size:12.5px;color:var(--ink-soft);margin:0;position:relative;z-index:1}
.case .meta{display:flex;align-items:center;justify-content:space-between;margin-top:auto;position:relative;z-index:1}
.stars{font-size:11.5px;letter-spacing:1px;color:var(--yellow-d)}
.case .cnt{font-size:11.5px;color:var(--ink-soft);font-weight:700}
.case .bar{height:6px;border-radius:999px;background:#F4EFE9;overflow:hidden;position:relative;z-index:1}
.case .bar span{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .4s}
.stamp{
  position:absolute;top:12px;right:-24px;transform:rotate(28deg);
  background:#fff;color:var(--mint-d);border:2px solid var(--mint-d);
  font-size:11px;font-weight:800;padding:2px 26px;letter-spacing:.5px;
  box-shadow:0 3px 8px rgba(0,0,0,.05);z-index:2
}
.stamp.reveal{color:var(--peach-d);border-color:var(--peach-d)}
.map-foot{margin-top:20px;font-size:12px;color:var(--ink-soft);text-align:center;line-height:1.7}

/* ---------- mission ---------- */
.mission-head{
  background:#fff;border:2px solid #fff;border-radius:24px;padding:14px 18px;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px;
}
.mission-head .case-num{width:44px;height:44px;font-size:16px;border-radius:15px}
.mh-text{min-width:0}
.mh-text h2{margin:0;font-size:18.5px;letter-spacing:-.3px}
.mh-text p{margin:3px 0 0;font-size:12.5px;color:var(--ink-soft)}
.mh-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip-timer{
  font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;
  background:var(--yellow);border-radius:999px;padding:8px 14px;color:#8A6A12;
  box-shadow:inset 0 0 0 2px #fff
}
.chip-timer.urgent{background:#FFD7D7;color:#B03A3A;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
.chip-score{font-weight:800;font-size:13.5px;background:#F6F1FF;border-radius:999px;padding:8px 13px;color:#6A57A8}

.mission-body{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(340px,.95fr);gap:16px;align-items:start}
.board-card{background:#fff;border:2px solid #fff;border-radius:26px;padding:14px;box-shadow:var(--shadow)}
.board-wrap{position:relative;width:100%;max-width:560px;margin:0 auto}
.board{
  position:relative;display:grid;gap:4px;
  background:linear-gradient(160deg,#FFFDFB,#FBF6FF);
  border-radius:18px;padding:8px;
}
.overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:0}
.cell{
  position:relative;z-index:1;display:grid;place-items:center;
  aspect-ratio:1/1;border-radius:12px;background:transparent;
  font-size:clamp(16px,3.6vw,26px);font-weight:600;color:#3E3548;
  user-select:none;-webkit-user-select:none;touch-action:none;
  box-shadow:inset 0 0 0 1.5px #F2ECE4;
  transition:background .12s ease, transform .12s ease, box-shadow .12s ease;
}
.board.dragging .cell{cursor:crosshair}
.cell.sel{background:rgba(255,233,150,.55);box-shadow:inset 0 0 0 2px #F1C948;transform:scale(.97)}
.cell.sel.bad{background:#FFE0E0;box-shadow:inset 0 0 0 2px #F0A0A0}
.cell.found{color:#3B2E4A;font-weight:700}
.cell.flash{animation:flashCell 1.5s ease}
@keyframes flashCell{
  0%,100%{background:transparent;box-shadow:inset 0 0 0 1.5px #F2ECE4}
  20%,60%{background:#FFF0B8;box-shadow:0 0 0 4px rgba(241,201,72,.55), inset 0 0 0 2px #F1C948;transform:scale(1.06)}
  40%,80%{background:#FFE9A8;transform:scale(1)}
}
.board-hint{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 4px 2px;font-size:12px;color:var(--ink-soft)}
.board-hint b{color:var(--ink)}

.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.pcard{background:#fff;border:2px solid #fff;border-radius:22px;padding:15px 16px;box-shadow:var(--shadow)}
.pcard h4{margin:0 0 8px;font-size:13px;letter-spacing:.3px;color:var(--ink-soft);font-weight:800;display:flex;align-items:center;gap:6px}
.rule-text{font-size:13px;line-height:1.65;margin:0}
.dir-note{margin:8px 0 0;font-size:12px;color:var(--ink-soft);background:#FBF7FF;border-radius:10px;padding:7px 10px;display:inline-block}
.clue-list{display:flex;flex-direction:column;gap:7px;max-height:min(46vh,430px);overflow:auto;padding-right:2px}
.clue{
  display:flex;gap:9px;align-items:flex-start;background:#FCFAF7;border-radius:14px;
  padding:9px 11px;border:1.5px solid #F5EEE6;font-size:13px;line-height:1.45;
  transition:background .2s, border-color .2s;
}
.clue .no{
  flex:0 0 auto;min-width:20px;height:20px;padding:0 5px;border-radius:7px;background:#EFE9FF;color:#6A57A8;
  font-size:11.5px;font-weight:800;display:grid;place-items:center;margin-top:1px
}
.clue .body{min-width:0;flex:1}
.clue .q{color:var(--ink)}
.clue .a{margin-top:3px;font-size:12.5px;color:var(--mint-d);font-weight:700;display:none}
.clue.done{background:#F2FCF7;border-color:#D6F2E6}
.clue.done .a{display:block}
.clue.done .q{color:var(--ink-soft)}
.clue.done .q .blank{color:var(--mint-d);font-weight:800}
.clue .han{font-weight:800;color:#40355A}
.clue.intruder{background:#FFF6F8;border-color:#FFDFE8}
.clue.intruder .q{color:#B0577A}
.blank{display:inline-block;min-width:1.6em;text-align:center;border-bottom:2px solid #E3D7C8;color:#B9AEC0}
.clue.done .blank{border-bottom:0;color:var(--mint-d)}
.clue .bonus{font-size:10.5px;font-weight:800;color:var(--peach-d);background:#FFF1E6;border-radius:999px;padding:1px 7px;margin-left:5px}

.challenge{background:linear-gradient(160deg,#FFF9F1,#F7F2FF);border:2px dashed #EDDFF7;border-radius:20px;padding:14px 15px}
.challenge h4{color:#8A6BB0}
.challenge .q{font-size:13.5px;line-height:1.55;margin:0 0 10px;font-weight:700}
.challenge .row{display:flex;gap:8px;flex-wrap:wrap}
.challenge input[type=text]{
  flex:1 1 150px;min-width:0;font:inherit;font-size:14px;padding:9px 12px;border-radius:12px;
  border:2px solid #EADFF3;background:#fff;color:var(--ink);outline:none
}
.challenge input[type=text]:focus{border-color:var(--lav-d);box-shadow:0 0 0 3px #EDE6FF}
.challenge .verdict{font-size:12.5px;margin:8px 0 0;font-weight:700}
.challenge .verdict.ok{color:var(--mint-d)}
.challenge .verdict.no{color:#D4788F}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  font:inherit;font-size:13px;padding:8px 13px;border-radius:999px;background:#fff;
  border:2px solid #EFE7F7;cursor:pointer;font-weight:700;color:var(--ink);transition:all .15s
}
.chip:hover{border-color:var(--lav-d)}
.chip.on{background:#EDE6FF;border-color:var(--lav-d);color:#5A46A0}
.chip.right{background:#E7FAF1;border-color:var(--mint-d);color:#2E8A68}
.chip.wrong{background:#FFEFF2;border-color:#F3B6C6;color:#B0577A}
.chip.dragging{transform:scale(.96)}
.group-box{margin-top:8px;border-radius:14px;background:#fff;border:2px solid #EFE7F7;padding:8px}
.group-box h5{margin:0 0 6px;font-size:12px;color:var(--ink-soft)}
.group-box .drop{min-height:38px;display:flex;flex-wrap:wrap;gap:6px;border-radius:10px;border:2px dashed #EADFF3;padding:6px}
.ghost-text{font-size:12px;color:#B9AEC0}

.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.board-card .actions{justify-content:center}

/* ---------- modal ---------- */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(70,55,90,.38);backdrop-filter:blur(4px);
  display:grid;place-items:center;padding:18px;z-index:50
}
.modal{
  background:#fff;border-radius:26px;padding:22px;max-width:560px;width:100%;
  box-shadow:0 30px 70px rgba(60,45,80,.28);max-height:88vh;overflow:auto;
  animation:pop .22s ease
}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.modal h3{margin:0 0 10px;font-size:19px;display:flex;align-items:center;gap:8px}
.modal .m-body{font-size:13.5px;line-height:1.75}
.modal .m-body b{color:#5A46A0}
.modal .m-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.rules-step{display:flex;gap:11px;background:#FBF8FF;border-radius:16px;padding:11px 13px;margin-bottom:9px}
.rules-step .n{width:26px;height:26px;border-radius:9px;background:var(--lav);display:grid;place-items:center;font-weight:800;font-size:12.5px;flex:0 0 auto;color:#5A46A0}
.rules-step h5{margin:0 0 3px;font-size:13.5px}
.rules-step p{margin:0;font-size:12.5px;color:var(--ink-soft);line-height:1.6}
.dir-map{display:grid;grid-template-columns:repeat(3,34px);gap:5px;justify-content:center;margin:6px 0 2px}
.dir-map span{width:34px;height:34px;border-radius:10px;background:#F4EFFF;display:grid;place-items:center;font-size:15px}
.dir-map span.bold{background:#E4D9FF;font-weight:800;box-shadow:inset 0 0 0 2px #B9A4F2}
.score-rule{font-size:12.5px;color:var(--ink-soft);line-height:1.8}

/* completion */
.finish{text-align:center}
.finish .big{font-size:52px;line-height:1}
.finish h3{justify-content:center;font-size:22px;margin:10px 0 4px}
.finish .hanja-big{font-size:30px;font-weight:800;letter-spacing:6px;color:#5A46A0;margin:6px 0}
.finish .stats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.finish .stat{background:#F8F4FF;border-radius:14px;padding:9px 14px;font-size:12.5px;font-weight:700}
.finish .stat b{display:block;font-size:18px;color:#5A46A0}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.confetti i{position:absolute;top:-8vh;font-size:18px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(420deg);opacity:.9}}

/* toast */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(30px);z-index:40;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,520px)}
.toast{
  background:#40355A;color:#fff;border-radius:16px;padding:11px 16px;font-size:13px;font-weight:700;
  box-shadow:0 14px 30px rgba(50,35,80,.28);opacity:0;transform:translateY(12px);
  transition:opacity .22s, transform .22s;text-align:center;max-width:100%
}
.toast.show{opacity:1;transform:translateY(0)}
.toast.ok{background:linear-gradient(135deg,#3FBF95,#2E9E8E)}
.toast.warn{background:linear-gradient(135deg,#F0A0A0,#D4788F)}
.toast.info{background:linear-gradient(135deg,#8E7BE0,#6A57A8)}

/* ---------- responsive ---------- */
@media (max-width:1040px){
  .cases{grid-template-columns:repeat(3,minmax(0,1fr))}
  .mission-body{grid-template-columns:minmax(0,1fr)}
  .board-wrap{max-width:520px}
  .clue-list{max-height:none;overflow:visible}
}
@media (max-width:680px){
  #app{padding:12px 12px 40px}
  .brand h1{font-size:18px}
  .brand p{font-size:11.5px}
  .brand .mark{width:42px;height:42px;font-size:21px;border-radius:14px}
  .topbar{flex-wrap:wrap;gap:10px}
  .top-actions{width:100%;margin-left:0}
  .stat-pill{font-size:12px;padding:7px 12px}
  .map-hero{padding:16px}
  .cases{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .case{padding:13px 12px}
  .case h3{font-size:14px}
  .case .sub{font-size:11.5px}
  .mission-head{padding:12px 13px;gap:10px}
  .mh-text h2{font-size:16px}
  .mh-right{width:100%;margin-left:0}
  .board-card{padding:9px;border-radius:20px}
  .board{gap:3px;padding:6px}
  .cell{border-radius:9px}
  .pcard{padding:13px}
  .panel{gap:10px}
  .btn{font-size:13px;padding:9px 13px}
}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="mark">🔍</div>
      <div>
        <h1><span class="han">漢字語</span> 탐정단</h1>
        <p>격자 속 한국의 한자어 찾기 · 미션 10</p>
      </div>
    </div>
    <div class="top-actions">
      <div class="stat-pill"><span class="dot"></span><span id="hdr-progress">0 / 10 사건 종결</span></div>
      <button class="btn icon ghost" id="btn-sound" title="소리 켜기/끄기">🔔</button>
      <button class="btn ghost" id="btn-rules">📜 수사 규칙</button>
    </div>
  </header>

  <main>
    <section id="screen-map" class="screen">
      <div class="map-hero">
        <div class="grow">
          <h2>사건 지도 🗺️</h2>
          <p>분야별 한자어 10개 사건 — 수업 시간에 맞춰 골라 수사하세요.</p>
          <div class="mini-progress"><span id="map-bar" style="width:0%"></span></div>
        </div>
        <div class="stat-pill">⭐ <span id="map-score">0</span>점</div>
        <button class="btn mint" id="btn-first">▶ 이어서 수사하기</button>
      </div>
      <div class="cases" id="cases"></div>
      <p class="map-foot">한자어 1개 = 1점 (미션 08은 2점) · 도전 문제 정답 = 3점 · 진행 상황은 이 기기에 저장됩니다.</p>
    </section>

    <section id="screen-mission" class="screen hidden">
      <div class="mission-head">
        <button class="btn icon ghost" id="btn-back" title="사건 지도로">←</button>
        <div class="case-num" id="m-num">01</div>
        <div class="mh-text">
          <h2 id="m-title">디지털 사건파일</h2>
          <p id="m-sub">초성 수사 보고서 · ★★☆☆</p>
        </div>
        <div class="mh-right">
          <div class="chip-timer hidden" id="m-timer">03:00</div>
          <div class="chip-score">🔎 <span id="m-found">0</span> / <span id="m-total">0</span></div>
          <button class="btn small ghost" id="btn-hint">💡 힌트</button>
          <button class="btn small ghost" id="btn-reveal">👁 정답 보기</button>
          <button class="btn small ghost" id="btn-reset">↺ 초기화</button>
        </div>
      </div>

      <div class="mission-body">
        <div class="board-card">
          <div class="board-wrap">
            <div class="board" id="board"></div>
            <svg class="overlay" id="overlay" xmlns="http://www.w3.org/2000/svg"></svg>

<script>
(function(){
"use strict";
const DATA = JSON.parse(document.getElementById('data').textContent);

const C = DATA.colors;
const KEY = 'hanja-detective-v1';

try{ const raw = localStorage.getItem(KEY); if(raw) state = Object.assign(state, JSON.parse(raw)); }catch(e){}

function ms(n){ if(!state.missions[n]) state.missions[n] = {found:[], revealed:false, challenge:false, time:null}; return state.missions[n]; }
function gridWords(m){ return Object.values(m.words).filter(w=>w.cells && w.cells.length); }
function wordByCells(m, cells){
  for(const w of gridWords(m)){
    if(w.cells.length !== cells.length) continue;
    let ok = true;
    for(let i=0;i<cells.length;i++){ if(w.cells[i][0]!==cells[i][0]||w.cells[i][1]!==cells[i][1]){ ok=false; break; } }
    if(ok) return w;
  }
  return null;
}
function cardFor(m, hanja){ return m.cards.find(c=>c.words.indexOf(hanja)>=0); }

/* ---------- utils ---------- */
const $ = s=>document.querySelector(s);
const $$ = s=>Array.from(document.querySelectorAll(s));
function h(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
function toast(msg, kind, ms){
  const box = $('#toast');
  while(box.children.length >= 2) box.firstElementChild.remove();

  box.appendChild(t);

  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),300); }, ms||2200);
}
let audioCtx=null;
function tone(freq, dur, type, gain){
  if(!state.sound) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type||'sine'; o.frequency.value = freq;
    g.gain.value = gain||0.05;
    o.connect(g); g.connect(audioCtx.destination);
    const t0 = audioCtx.currentTime;
    g.gain.setValueAtTime(g.gain.value, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.start(t0); o.stop(t0+dur);
  }catch(e){}
}
function sfxOk(){ tone(740,0.12,'sine',0.06); setTimeout(()=>tone(988,0.16,'sine',0.05),90); }
function sfxNo(){ tone(220,0.16,'triangle',0.05); }
function sfxWin(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.22,'sine',0.05), i*110)); }

}
function missionScore(m, st){
  const words = gridWords(m);
  let s = 0;
  st.found.forEach(x=>{ const w = m.words[x]; if(w && w.cells && w.cells.length) s += (m.num===8 ? (w.bonus?3:2) : 1); });
  if(st.challenge) s += 3;
  return s;
}

/* ---------- board interaction ---------- */
function bindBoard(){
  const board = $('#board');
  board.onpointerdown = onDown;
  board.onpointermove = onMove;
  board.onpointerup = onUp;
  board.onpointercancel = onUp;
  board.onpointerleave = ()=>{ if(drag) onUp(); };
}
function cellAt(x,y){
  const el = document.elementFromPoint(x,y);
  return el && el.closest ? el.closest('.cell') : null;
}
function cellCenter(r,c){
  const el = document.querySelector('.cell[data-r="'+r+'"][data-c="'+c+'"]');
  if(!el) return null;
  const b = el.getBoundingClientRect();
  return {x:b.left+b.width/2, y:b.top+b.height/2};
}
function onDown(e){
  if(!cur) return;
  if(cur.num===8 && !timerRunning && ms(8).found.length===0){ startTimer(true); }
  if(cur.num===8 && !timerRunning && timeLeft<=0) return;
  const cell = e.target.closest('.cell'); if(!cell) return;
  drag = {r:+cell.dataset.r, c:+cell.dataset.c};
  selCells = [[drag.r,drag.c]];
  paintSel();
  $('#board').classList.add('dragging');
  try{ $('#board').setPointerCapture(e.pointerId); }catch(err){}
  e.preventDefault();
}
function onMove(e){
  if(!drag) return;
  const cell = cellAt(e.clientX, e.clientY);
  if(!cell) return;
  const r = +cell.dataset.r, c = +cell.dataset.c;
  const cs = lineCells(drag, {r,c});
  if(!cs) return;
  selCells = cs; paintSel();
  e.preventDefault();
}
function onUp(e){
  if(!drag) return;
  const cells = selCells;
  drag = null;
  $('#board').classList.remove('dragging');
  clearSel();
  if(!cells || cells.length<2){ return; }
  const m = cur, st = ms(m.num);
  const w = wordByCells(m, cells);
  if(w && st.found.indexOf(w.hanja)<0){
    st.found.push(w.hanja); save();
    sfxOk();
    toast(w.hanja+' ('+w.reading+')'+(w.meaning?' · '+w.meaning:'')+(w.bonus?' ★ 보너스':''), 'ok', 2600);
    drawFound(); renderClues(); updateFound(); renderMap(); checkComplete();
    return;
  }
  if(w && st.found.indexOf(w.hanja)>=0){ toast('이미 찾은 한자어예요 👍','info',1600); return; }
  // reversed?
  const rev = cells.slice().reverse();
  const wr = wordByCells(m, rev);
  if(wr){ toast('방향을 확인해 보세요! '+m.allowDirs.join(' ')+' 방향으로 읽어요','warn',2600); sfxNo(); return; }
  if(cells.length>=2){ sfxNo(); toast('그 글자 조합은 단서와 달라요. 다시 찾아볼까요?','warn',1800); }
}
function lineCells(a,b){
  const dr = b.r-a.r, dc = b.c-a.c;
  const adr = Math.abs(dr), adc = Math.abs(dc);
  if(!(adr===0 || adc===0 || adr===adc)) return null;
  const n = Math.max(adr,adc)+1;
  if(n<2) return [[a.r,a.c]];
  const sr = Math.sign(dr), sc = Math.sign(dc);
  return Array.from({length:n},(_,i)=>[a.r+sr*i, a.c+sc*i]);
}
function paintSel(){
  clearSel();
  selCells.forEach(([r,c])=>{
    const el = document.querySelector('.cell[data-r="'+r+'"][data-c="'+c+'"]');
    if(el) el.classList.add('sel');
  });
  const ov = $('#overlay');
  const NS='http://www.w3.org/2000/svg';
  const old = ov.querySelector('.temp'); if(old) old.remove();
  const a = selCells[0], b = selCells[selCells.length-1];
  const line = document.createElementNS(NS,'line');
  line.setAttribute('class','temp');
  line.setAttribute('x1',a[1]+0.5); line.setAttribute('y1',a[0]+0.5);
  line.setAttribute('x2',b[1]+0.5); line.setAttribute('y2',b[0]+0.5);
  line.setAttribute('stroke','#F1C948'); line.setAttribute('stroke-width',0.72);
  line.setAttribute('stroke-linecap','round'); line.setAttribute('opacity','0.5');
  ov.appendChild(line);
}
function clearSel(){
  $$('.cell.sel').forEach(el=>el.classList.remove('sel'));
  const ov = $('#overlay'); const t = ov.querySelector('.temp'); if(t) t.remove();
}
function updateFound(){
  const st = ms(cur.num);
  $('#m-found').textContent = st.found.filter(x=>gridWords(cur).some(w=>w.hanja===x)).length;
}

$('#btn-reveal').addEventListener('click', ()=>{
  if(!cur) return;
  const st = ms(cur.num);
  const words = gridWords(cur);
  const unfound = words.filter(w=>st.found.indexOf(w.hanja)<0);
  if(!unfound.length){ toast('이미 모두 찾았어요 👍','info'); return; }
  modal({
    title:'👁 정답을 볼까요?',
    body:'남은 <b>'+unfound.length+'개</b> 한자어를 격자에 표시합니다. 정답을 본 사건은 <b>「확인」</b> 도장으로 남아요.',
    actions:[{label:'취소',cls:'ghost'},{label:'정답 보기',cls:'primary',onClick:()=>{
      unfound.forEach(w=>st.found.push(w.hanja));
      st.revealed = true; save();
      drawFound(); renderClues(); updateFound(); renderMap(); closeModal();
      toast('남은 정답을 표시했어요. 격자에서 확인해 보세요!','info',2600);
      checkComplete(true);
    }}]
  });
});
$('#btn-reset').addEventListener('click', ()=>{
  if(!cur) return;
  modal({
    title:'↺ 이 사건을 초기화할까요?',
    body:'찾은 기록과 도전 문제 풀이가 지워집니다.',
    actions:[{label:'취소',cls:'ghost'},{label:'초기화',cls:'primary',onClick:()=>{
      state.missions[cur.num] = {found:[], revealed:false, challenge:false, time:null};
      save(); closeModal(); renderMission(); renderMap(); toast('사건을 처음부터 다시 시작합니다','info');
    }}]
  });
});
$('#btn-back').addEventListener('click', ()=>{
  stopTimer();
  show('screen-map'); renderMap();
});
$('#btn-start').addEventListener('click', ()=>{ startTimer(true); });

/* ---------- timer (mission 08) ---------- */
function setupTimer(){
  stopTimer();
  if(cur.num!==8) return;
  const st = ms(8);
  timeLeft = st.time!=null ? st.time : 180;
  if(st.found.length>0 && timeLeft>0 && !st.revealed){ /* 이어하기: 자동 시작하지 않음 */ }
}
function startTimer(manual){
  if(cur.num!==8) return;
  if(!timeLeft || timeLeft<=0) timeLeft = 180;
  if(timerRunning) return;
  timerRunning = true;
  $('#btn-start').style.display = 'none';
  const t0 = Date.now(), base = timeLeft;
  timer = setInterval(()=>{
    timeLeft = base - Math.floor((Date.now()-t0)/1000);
    const st = ms(8); st.time = Math.max(0,timeLeft); save();
    $('#m-timer').textContent = fmt(timeLeft);
    $('#m-timer').classList.toggle('urgent', timeLeft<=30);
    if(timeLeft<=0){ stopTimer(); timeUp(); }
  }, 250);
  if(manual) toast('3분 타임어택 시작! ⏱','info',2000);
}
function stopTimer(){ if(timer){ clearInterval(timer); timer=null; } timerRunning=false; }
function timeUp(){
  const m=cur, st=ms(8), words=gridWords(m);
  const found = words.filter(w=>st.found.indexOf(w.hanja)>=0).length;
  sfxNo();
  modal({
    title:'⏰ 시간 종료!',
    body:'3분이 지났어요. 이번 판에서 <b>'+found+' / '+words.length+'</b>개를 찾았습니다.<br>점수: <b>'+(found*2)+'점</b> (한자어 1개 = 2점)',
    actions:[{label:'다시 도전',cls:'primary',onClick:()=>{
      state.missions[8] = {found:[], revealed:false, challenge:false, time:null};
      save(); closeModal(); renderMission(); renderMap();
    }},{label:'사건 지도로',cls:'ghost',onClick:()=>{ closeModal(); show('screen-map'); renderMap(); }}]
  });
}

/* ---------- completion ---------- */
function checkComplete(fromReveal){
  const m = cur, st = ms(m.num), words = gridWords(m);
  const all = words.every(w=>st.found.indexOf(w.hanja)>=0);
  if(!all){ 
    if(!fromReveal && words.length - st.found.length === 0) {}
    return;
  }
  if(!st.challenge){
    toast('모든 한자어를 찾았어요! 🎉 도전 문제까지 풀면 사건 종결!','info',3000);
    return;
  }
  if(st.done) return;
  st.done = true; save();
  sfxWin(); confetti();
  const score = missionScore(m, st);
  modal({
    title:'', body:'', className:'finish', dismissable:true,
    html:'<div class="big">'+(st.revealed?'🗂️':'🎉')+'</div>'+
      '<div class="hanja-big">'+(st.revealed?'確認完了':'事件終結')+'</div>'+
      '<h3>'+(st.revealed?'정답을 확인했어요!':'사건 종결! 수고했어요, 탐정님')+'</h3>'+
      '<p style="font-size:13px;color:#7A7189;margin:4px 0 0">'+m.numLabel+'. '+m.title+' — '+m.subtitle+'</p>'+
      '<div class="stats">'+
        '<div class="stat"><b>'+words.length+'</b>찾은 한자어</div>'+
        '<div class="stat"><b>+'+score+'</b>이번 사건 점수</div>'+
        '<div class="stat"><b>'+totalScore()+'</b>누적 점수</div>'+
      '</div>',
    actions:[
      {label:'사건 지도로', cls:'ghost', onClick:()=>{ closeModal(); show('screen-map'); renderMap(); }},
      nextMission() ? {label:'다음 사건 →', cls:'primary', onClick:()=>{ closeModal(); openMission(nextMission().num); }} : 
      {label:'모두 종결! 🎉', cls:'primary', onClick:()=>{ closeModal(); show('screen-map'); renderMap(); }}
    ]
  });
  renderMap();
}
function isDone(m){ const st=ms(m.num), ws=gridWords(m); return st.found.length>=ws.length && st.challenge; }
function nextMission(){
  const i = MISSIONS.indexOf(cur);
  for(let k=i+1;k<MISSIONS.length;k++){ if(!isDone(MISSIONS[k])) return MISSIONS[k]; }
  for(let k=0;k<MISSIONS.length;k++){ if(k!==i && !isDone(MISSIONS[k])) return MISSIONS[k]; }
  return null;
}
function totalScore(){
  return MISSIONS.reduce((s,m)=>s+missionScore(m, ms(m.num)),0);
}
function confetti(){
  const box = h('div','confetti');
  const emo = ['🎉','✨','🔍','⭐','🎊','💜','🩵','🌷'];
  for(let i=0;i<26;i++){
    const s = h('i', null, emo[i%emo.length]);
    s.style.left = (Math.random()*100)+'vw';
    s.style.animationDuration = (2.2+Math.random()*1.8)+'s';
    s.style.animationDelay = (Math.random()*0.7)+'s';
    s.style.fontSize = (14+Math.random()*16)+'px';
    box.appendChild(s);
  }
  document.body.appendChild(box);
  setTimeout(()=>box.remove(), 5000);
}

/* ---------- modal ---------- */
function modal(opts){
  const back = $('#modal-backdrop'), box = $('#modal');
  box.className = 'modal '+(opts.className||'');
  box.innerHTML='';
  if(opts.html) box.innerHTML = opts.html;
  else {
    if(opts.title) box.appendChild(h('h3',null,opts.title));
    const b = h('div','m-body'); b.innerHTML = opts.body||''; box.appendChild(b);
  }
  const acts = h('div','m-actions');
  (opts.actions||[]).forEach(a=>{
    const btn = h('button','btn '+(a.cls||'ghost'), a.label);
    btn.addEventListener('click', ()=>{ if(a.onClick) a.onClick(); else closeModal(); });
    acts.appendChild(btn);
  });
  box.appendChild(acts);
  back.classList.remove('hidden');
  back.onclick = e=>{ if(e.target===back && opts.dismissable) closeModal(); };
}
function closeModal(){ $('#modal-backdrop').classList.add('hidden'); }

/* ---------- rules / sound ---------- */
$('#btn-rules').addEventListener('click', ()=>{
  modal({
    title:'📜 수사 규칙',
    body:
      '<div class="rules-step"><div class="n">1</div><div><h5>미션 단서 확인</h5><p>초성 · 훈음 · 뜻풀이 · 헤드라인 · 깨진 조각 등 미션마다 단서가 다릅니다. 무엇이 주어졌는지 먼저 확인!</p></div></div>'+
      '<div class="rules-step"><div class="n">2</div><div><h5>격자에서 한자어 찾기</h5><p>한자어는 2~4글자입니다. 격자 위를 드래그해 직선으로 이으면, 맞는 한자어는 캡슐 모양으로 표시되고 음과 뜻이 공개됩니다.</p></div></div>'+
      '<div class="rules-step"><div class="n">3</div><div><h5>도전 문제 해결</h5><p>침입자, 숨은 사자성어, 반의어 짝꿍, 분류하기까지 풀어야 사건 종결!</p></div></div>'+
      '<p class="score-rule"><b>읽는 방향</b><br>정방향(굵은 테두리) → ↓ ↘ ↗ : 미션 01~09<br>역방향 ← ↑ ↖ ↙ : 보스(미션 10)만</p>'+
      '<div class="dir-map"><span>↖</span><span class="bold">↑</span><span>↗</span><span>←</span><span>字</span><span class="bold">→</span><span>↙</span><span class="bold">↓</span><span class="bold">↘</span></div>'+
      '<p class="score-rule" style="margin-top:10px"><b>모둠 점수 규칙</b><br>한자어 1개 = 1점 (음까지 맞게 쓰면 +1점) · 도전 문제 정답 = 3점 · 가장 먼저 사건 종결 = +2점 (미션 08은 별도 점수제)</p>',
    actions:[{label:'알겠어요!',cls:'primary'}]
  });
});
$('#btn-sound').addEventListener('click', ()=>{
  state.sound = !state.sound; save();
  $('#btn-sound').textContent = state.sound ? '🔔' : '🔕';
  if(state.sound) tone(660,0.12,'sine',0.05);
  toast(state.sound?'소리를 켰어요':'소리를 껐어요','info',1400);
});
$('#btn-sound').textContent = state.sound ? '🔔' : '🔕';

/* keyboard: Esc closes modal / back to map */
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    if(!$('#modal-backdrop').classList.contains('hidden')) closeModal();
    else if(cur){ stopTimer(); show('screen-map'); renderMap(); }
  }
});
window.addEventListener('resize', ()=>{ if(cur && !$('#screen-mission').classList.contains('hidden')); });

/* ---------- boot ---------- */
MISSIONS.forEach(m=>{ ms(m.num); });
renderMap();
// restore 시간 표시
})();
</script>
